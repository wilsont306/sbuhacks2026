<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Blueprint: Toy Theatre</title>
</head>
<body>
  <div id="tv">
    <aside class="margin left" aria-label="Station sign and the stops on this line">
      <div class="tombstone" id="label"></div>
    </aside>

    <main id="stage" aria-label="The artwork stage. Arrow keys walk the figure, Space pokes the object it stands at.">
      <canvas id="gl" width="1447" height="1080"></canvas>
      <p id="status" hidden aria-live="polite"></p>
      <p id="hint" aria-live="polite"></p>
      <p id="caption" hidden></p>
      <div id="original" hidden>
        <img alt="The original picture, untouched">
        <p class="tag"></p>
      </div>
    </main>

    <aside class="margin right" aria-label="Riders and the join ticket">
      <div id="modeTag"></div>
      <div id="hud"></div>
      <section id="roster" aria-live="polite"></section>
      <div id="resting" hidden></div>
      <div id="qr"></div>
    </aside>
  </div>
  <script type="module" src="/src/host/main.js"></script>
</body>
</html>
