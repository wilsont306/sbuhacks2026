name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      # Same as vercel.json's installCommand: skip onnxruntime-node's CUDA download.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (node --test)
        run: npm test

      - name: Build (Vite)
        run: npm run build
