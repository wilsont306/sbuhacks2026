# Fly.io config for the Toy Theatre hub. Region ewr = Newark, the closest to Stony Brook.
# ONE machine only: slots and tokens live in memory, so a second machine would split players from the host.
# First deploy: fly deploy --ha=false   (otherwise flyctl creates two machines; fix with fly scale count 1)
# Secrets: fly secrets set HOST_TOKEN=<random> JOIN_URL=https://<project>.vercel.app/ ALLOW_ORIGIN=https://<project>.vercel.app

app = "toy-theatre-hub"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # never let the machine sleep in front of a judge
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
